spring:
  application:
    name: rm-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rm}
    username: ${DB_USERNAME:rm}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  cache:
    type: simple

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    default-statement-timeout: 5

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
      base-path: /actuator
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        annual_summary.api.latency: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99
        annual_summary.api.latency: 0.5, 0.95, 0.99
      slo:
        annual_summary.api.latency: 200ms,500ms,1s

features:
  annualPerformanceSummary:
    enabled: ${ANNUAL_PERFORMANCE_SUMMARY_ENABLED:true}

auth:
  test-principal:
    enabled: ${AUTH_TEST_PRINCIPAL_ENABLED:false}
