name: backend-ci

on:
  pull_request:
    branches: [main, "change/**"]
    paths:
      - 'apps/backend/**'
      - 'deploy/**'
      - '.github/workflows/backend-ci.yml'
  push:
    branches: [main, "change/**"]
    paths:
      - 'apps/backend/**'
      - 'deploy/**'
      - '.github/workflows/backend-ci.yml'

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/rm-backend

jobs:
  package-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify package declarations match directory layout
        run: |
          set -e
          while IFS= read -r f; do
            rel=$(echo "$f" | sed -E 's#apps/backend/src/(main|test)/java/##')
            expected_pkg=$(dirname "$rel" | tr '/' '.')
            actual_pkg=$(grep -E '^package ' "$f" | head -n1 | sed -E 's/package +//; s/;//')
            if [ "$expected_pkg" != "$actual_pkg" ]; then
              echo "::error file=$f::package mismatch (expected '$expected_pkg', got '$actual_pkg')"
              exit 1
            fi
          done < <(find apps/backend/src -name '*.java')

  test:
    runs-on: ubuntu-latest
    needs: package-structure
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: mvn test
        working-directory: apps/backend
        run: mvn -B -ntp -Dstyle.color=always test
      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: apps/backend/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  package:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: mvn package (skip tests, already green)
        working-directory: apps/backend
        run: mvn -B -ntp -DskipTests -Dstyle.color=always package
      - name: Upload backend fat jar
        uses: actions/upload-artifact@v4
        with:
          name: rm-backend-jar
          path: apps/backend/target/rm-backend-*.jar
          retention-days: 14

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and push on push events)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
