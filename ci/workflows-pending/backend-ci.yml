name: backend-ci

on:
  pull_request:
    branches: [main, change/**]
    paths:
      - 'apps/backend/**'
      - '.github/workflows/backend-ci.yml'
  push:
    branches: [main, change/**]
    paths:
      - 'apps/backend/**'

# 构建工具尚未敲定（apps/backend/BUILD_TOOL_TBD.md）。本工作流暂时只做：
#  1) 包结构 / 命名空间一致性检查（grep 检查 package 与目录对齐）
#  2) 占位编译步骤（架构师补 pom.xml 或 build.gradle.kts 后改为真实编译）
# 评审通过技术栈后将本文件升级为 mvn / gradle 完整流水线（lint + test + build + sonar）。

jobs:
  sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify package declarations match directory layout
        run: |
          set -e
          fail=0
          find apps/backend/src -name '*.java' | while read -r f; do
            rel=$(echo "$f" | sed -E 's#apps/backend/src/(main|test)/java/##')
            expected_pkg=$(dirname "$rel" | tr '/' '.')
            actual_pkg=$(grep -E '^package ' "$f" | head -n1 | sed -E 's/package +//; s/;//')
            if [ "$expected_pkg" != "$actual_pkg" ]; then
              echo "::error file=$f::package mismatch (expected '$expected_pkg', got '$actual_pkg')"
              exit 1
            fi
          done

      - name: Note build tool TBD
        run: |
          echo "::notice::Build tool not yet selected — see apps/backend/BUILD_TOOL_TBD.md."
          echo "Once Maven/Gradle is picked, replace this job with a real test+build pipeline."
