# EXAMPLE ONLY. Do NOT commit a populated copy.
# Apply with: kubectl -n rm-annual-summary-uat apply -f secret.yaml
# Or generate from a sealed-secrets / vault pipeline owned by the cluster operator.
apiVersion: v1
kind: Secret
metadata:
  name: rm-backend-secrets
  namespace: rm-annual-summary-uat
  labels:
    app.kubernetes.io/name: rm-backend
type: Opaque
stringData:
  # JDBC URL for the UAT managed Postgres (or in-cluster StatefulSet).
  DB_URL: "jdbc:postgresql://REPLACE_DB_HOST:5432/rm"
  DB_USERNAME: "REPLACE_DB_USER"
  DB_PASSWORD: "REPLACE_DB_PASSWORD"
  # SSO bridge config — REQUIRED. The current build only has the SsoClient *interface*;
  # the production implementation has not been written. See blocker B-SSO in deploy/k8s/uat/README.md.
  SSO_ISSUER_URL: "REPLACE_SSO_ISSUER"
  SSO_CLIENT_ID: "REPLACE_SSO_CLIENT_ID"
  SSO_CLIENT_SECRET: "REPLACE_SSO_CLIENT_SECRET"
