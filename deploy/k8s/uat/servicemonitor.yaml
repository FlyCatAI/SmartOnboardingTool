# Optional: requires Prometheus Operator (kube-prometheus-stack) in the cluster.
# If the cluster uses a plain prometheus.yaml file, skip this and add a scrape
# job equivalent to deploy/prometheus/prometheus.yml.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: rm-backend
  namespace: rm-annual-summary-uat
  labels:
    # REPLACE if the cluster's Prometheus selects ServiceMonitors via a different label
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: rm-backend
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 30s
      scrapeTimeout: 10s
