# Ingress for the UAT entrypoint. Annotations are for nginx-ingress;
# adjust for the cluster's actual ingress controller (e.g. APISIX, Higress, ALB).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rm-backend
  namespace: rm-annual-summary-uat
  annotations:
    # REPLACE: TLS secret holding the UAT cert (e.g. wildcard *.uat.example.cn)
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
spec:
  ingressClassName: REPLACE_INGRESS_CLASS
  tls:
    - hosts:
        - REPLACE_UAT_HOST
      secretName: REPLACE_TLS_SECRET
  rules:
    - host: REPLACE_UAT_HOST
      http:
        paths:
          - path: /api/v1/performance/
            pathType: Prefix
            backend:
              service:
                name: rm-backend
                port:
                  number: 80
          - path: /actuator/health
            pathType: Prefix
            backend:
              service:
                name: rm-backend
                port:
                  number: 80
---
# Restrict everything else: only ingress controller and prometheus may reach pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rm-backend
  namespace: rm-annual-summary-uat
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: rm-backend
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # Allow DNS + Postgres + SSO. Tighten DB host / SSO host once provided.
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to: []
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 443
