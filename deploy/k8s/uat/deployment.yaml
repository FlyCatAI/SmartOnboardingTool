apiVersion: apps/v1
kind: Deployment
metadata:
  name: rm-backend
  namespace: rm-annual-summary-uat
  labels:
    app.kubernetes.io/name: rm-backend
    app.kubernetes.io/part-of: rm-annual-summary
    app.kubernetes.io/version: "REPLACE_IMAGE_TAG"
  annotations:
    # Track the source commit so canary/rollback tags line up with deploy log audit.
    rm.flycat.ai/source-commit: "REPLACE_SOURCE_SHA"
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: rm-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rm-backend
        app.kubernetes.io/part-of: rm-annual-summary
        track: stable
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      serviceAccountName: rm-backend
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: ghcr.io/flycatai/rm-backend:REPLACE_IMAGE_TAG
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: rm-backend-config
            - secretRef:
                name: rm-backend-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "2Gi"
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: rm-backend
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rm-backend
  namespace: rm-annual-summary-uat
