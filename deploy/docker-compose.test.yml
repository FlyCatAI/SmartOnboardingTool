# docker-compose for the test/E2E environment (4.2 落地)
#
# Spins up:
#   - postgres : PostgreSQL 14 with annual-performance-summary schema + Q-1 seed
#   - backend  : RM backend Spring Boot fat jar from apps/backend/Dockerfile
#   - prometheus (optional) : scrapes backend /actuator/prometheus
#
# Quick start (from repo root):
#   docker compose -f deploy/docker-compose.test.yml up --build -d
#   curl -s http://localhost:8080/actuator/health/readiness | jq
#   curl -s 'http://localhost:8080/api/v1/performance/annual-summary?period_type=current_year' \
#     -H 'X-Test-Employee-Id: RM001' | jq      # requires test SSO shim configured
#
# Tear down (drops the Postgres volume so seed re-runs on next up):
#   docker compose -f deploy/docker-compose.test.yml down -v

name: rm-annual-summary-test

services:
  postgres:
    image: postgres:14-alpine
    container_name: rm-postgres
    environment:
      POSTGRES_DB: rm
      POSTGRES_USER: rm
      POSTGRES_PASSWORD: rm
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # canonical migration mounted into a path the bootstrap script \i's
      - ../migrations/V202605201441__annual_performance_summary.sql:/migrations/annual-performance-summary.sql:ro
      # schema + seed scripts (executed in alphabetical order on first start)
      - ./postgres/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./postgres/02-seed-q1-snapshot.sql:/docker-entrypoint-initdb.d/02-seed-q1-snapshot.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rm -d rm"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    image: rm-backend:test
    container_name: rm-backend
    build:
      context: ..
      dockerfile: apps/backend/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/rm
      DB_USERNAME: rm
      DB_PASSWORD: rm
      SERVER_PORT: "8080"
      ANNUAL_PERFORMANCE_SUMMARY_ENABLED: "true"
      JAVA_OPTS: "-XX:MaxRAMPercentage=75"
    ports:
      - "8080:8080"
    healthcheck:
      test:
        - CMD
        - sh
        - -c
        - "curl --fail --silent http://127.0.0.1:8080/actuator/health/readiness || exit 1"
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: rm-prometheus
    depends_on:
      backend:
        condition: service_started
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    profiles:
      - observability

volumes:
  postgres-data:
