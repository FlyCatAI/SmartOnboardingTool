name: openspec-validate

on:
  pull_request:
    branches: [main, "change/**"]
    paths:
      - 'openspec/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/openspec-validate.yml'
  push:
    branches: [main, "change/**"]
    paths:
      - 'openspec/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/openspec-validate.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Validate all OpenSpec changes
        run: |
          set -e
          for dir in openspec/changes/*/; do
            slug=$(basename "$dir")
            echo "--- validating $slug ---"
            npx openspec validate "$slug"
          done
